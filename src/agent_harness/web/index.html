<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Harness Console</title>
<style>
:root{
  --ink:#101b35;--ink-2:#33415c;--muted:#68768b;--faint:#98a2b3;
  --paper:#f3f6fb;--card:#fff;--line:#e2e8f1;--line-2:#d0d9e6;
  --blue:#3265ed;--blue-soft:#eaf0ff;--navy:#0d1b36;
  --green:#067a5b;--green-soft:#e6f6f0;--red:#b4233c;--red-soft:#fdecef;--amber:#a15c07;--amber-soft:#fff4e0;
  --shadow:0 12px 34px -18px rgba(16,27,53,.35);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(120deg,#0b1730,#13285a 70%,#1d3a8a);color:#fff;padding:18px 30px}
.head-inner{max-width:1300px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--blue);display:grid;place-items:center;box-shadow:0 8px 22px -6px rgba(50,101,237,.8)}
header h1{margin:0;font-size:18px;letter-spacing:-.01em}
header .sub{color:#a9bde3;font-size:12.5px}
.conn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:600}
.conn i{width:8px;height:8px;border-radius:50%;background:#fbbf24}
.conn.live i{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
.conn.err i{background:#f87171}
main{max-width:1300px;margin:auto;padding:24px 30px 48px}
.tabs{display:inline-flex;gap:4px;padding:4px;margin-bottom:18px;background:#e6ebf3;border-radius:11px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:650;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.tabs button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,27,53,.12)}
.count{min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:6px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}
.card{padding:16px 18px;display:grid;gap:4px}
.card .label{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.card strong{font-size:28px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .hint{color:var(--faint);font-size:12px}
.card.good strong{color:var(--green)}.card.bad strong{color:var(--red)}.card.warn strong{color:var(--amber)}
.scope{color:var(--muted);font-size:12.5px;margin:0 2px 16px}
.scope b{color:var(--ink-2)}
.panel{padding:18px}
.toolbar{display:flex;gap:10px;margin-bottom:6px}
.toolbar input{flex:1}
input,select,textarea{padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:#f7f9fd}
tbody tr.selected{background:var(--blue-soft)}
tbody tr:last-child td{border-bottom:0}
.run-label{font-weight:700}.when{color:var(--muted);font-size:12px;font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{width:64px;height:6px;border-radius:99px;background:#edf1f7;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.pass{background:var(--green-soft);color:var(--green)}
.pill.fail{background:var(--red-soft);color:var(--red)}
.pill.attn{background:var(--amber-soft);color:var(--amber)}
.pill.neutral{background:#eef1f6;color:var(--muted)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:22px 2px 12px}
.section-title h2{margin:0;font-size:18px;letter-spacing:-.01em}
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;align-items:start}
.case{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:14px 16px}
.case.fail{border-left-color:var(--red)}
.case-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.case-id{font:600 13px var(--mono);word-break:break-word}
.case-stats{display:flex;gap:16px;margin:10px 0 4px;color:var(--muted);font-size:12px}
.case-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
details.more summary{cursor:pointer;color:var(--blue);font-size:12.5px;font-weight:600;margin-top:6px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ "}details.more[open] summary::before{content:"▾ "}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.io h4,.block h4{margin:0 0 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
pre{margin:0;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;background:#0f1a33;color:#dce6ff;padding:11px 12px;border-radius:9px;font:12px/1.55 var(--mono)}
.timeline{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line-2)}
.timeline li{position:relative;padding:4px 0 8px 12px}
.timeline li::before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--blue)}
.timeline li.blocked::before,.timeline li.error::before{border-color:var(--red);background:var(--red-soft)}
.timeline li.pending::before,.timeline li.needs_confirmation::before{border-color:var(--amber)}
.t-type{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.t-name{font-weight:650}
.t-status{float:right;font-size:11.5px;color:var(--muted)}
.review{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.review-list{padding:8px}
.review-list h3{margin:8px 10px 10px;font-size:14px}
.review-list button{width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:11px 12px;border-radius:10px;cursor:pointer;display:grid;justify-items:start;gap:6px;transition:background .12s}
.review-list .meta{display:flex;gap:8px;align-items:center;font-size:12px}
.review-list button:hover{background:#f6f8fc}
.review-list button.selected{background:var(--blue-soft);border-color:#c9d6fb}
.review-list .case-id{font-size:12.5px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;display:block;margin-bottom:6px}
.capsule{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 16px}
.capsule div{background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.capsule span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.capsule b{font-size:13.5px;word-break:break-word}
.control{background:var(--blue-soft);border:1px solid #c9d6fb;color:#1d3a8a;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.decision{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.seg{display:inline-flex;gap:6px}
.seg button{border:1px solid var(--line-2);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:650}
.seg button[data-v=pass].on{background:var(--green);border-color:var(--green);color:#fff}
.seg button[data-v=fail].on{background:var(--red);border-color:var(--red);color:#fff}
.seg button[data-v=ambiguous].on{background:var(--amber);border-color:var(--amber);color:#fff}
.decision .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.primary{border:0;background:var(--blue);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;justify-self:start;box-shadow:0 8px 18px -8px rgba(50,101,237,.8)}
.primary:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid #9db4f7;outline-offset:2px}
@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .review{grid-template-columns:1fr}
  .io,.capsule{grid-template-columns:1fr}
  main,header{padding-left:16px;padding-right:16px}
  .case-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand">
      <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
      <div><h1>Agent Harness Console</h1><div class="sub">Persistent runs · traces · human decisions</div></div>
    </div>
    <div class="conn" id="connection"><i></i><span>connecting…</span></div>
  </div>
</header>
<main>
  <div class="tabs" role="tablist">
    <button class="active" data-tab="runs" role="tab">Runs</button>
    <button data-tab="reviews" role="tab">Review queue <span class="count hidden" id="review-count">0</span></button>
  </div>

  <section id="runs">
    <div class="cards" id="cards"></div>
    <p class="scope" id="scope"></p>
    <div class="panel">
      <div class="toolbar">
        <input id="filter" placeholder="Filter by model, suite, or label" aria-label="Filter runs">
        <select id="result-filter" aria-label="Filter by outcome"><option value="">All outcomes</option><option value="pass">Passed</option><option value="fail">Failed</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Run</th><th>Gate</th><th>Model</th><th>Suite</th><th>Pass rate</th><th>Grounded</th><th>Tools</th><th>Safety</th><th>Cost</th></tr></thead>
          <tbody id="runs-body"></tbody>
        </table>
      </div>
    </div>
    <div id="trace-panel" class="hidden"></div>
  </section>

  <section id="reviews" class="hidden">
    <div class="review">
      <div class="panel review-list" id="review-list"></div>
      <div class="panel" id="review-detail"><div class="empty"><span class="big">⚖️</span>Choose a case to inspect its evidence capsule and trace.</div></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
let runs = [], reviews = [], selected = null, selectedRun = null, decision = "pass";
const q = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => `${Math.round(Number(v || 0) * 100)}%`;
const human = (s) => String(s || "").replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase());
const show = (value) => (typeof value === "string" ? value : JSON.stringify(value, null, 2));

function toast(message) {
  const t = q("#toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 1800);
}

async function api(path, opt = {}) {
  let token = localStorage.getItem("agentHarnessToken");
  opt.headers = { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) };
  const r = await fetch(path, opt);
  if (r.status === 401) {
    token = prompt("Dashboard token");
    localStorage.setItem("agentHarnessToken", token);
    return api(path, opt);
  }
  if (!r.ok) throw Error((await r.json()).error);
  return r.json();
}

function setConnection(state, text) {
  const el = q("#connection");
  el.className = `conn ${state}`;
  el.querySelector("span").textContent = text;
}

async function load() {
  try {
    [runs, reviews] = await Promise.all([api("/api/runs"), api("/api/reviews?status=pending")]);
    setConnection("live", `live · ${runs.length} run${runs.length === 1 ? "" : "s"}`);
    renderRuns();
    renderReviews();
  } catch (e) {
    setConnection("err", "error: " + e.message);
  }
}

function meter(value) {
  const v = Math.max(0, Math.min(1, Number(value || 0)));
  return `<span class="meter"><span class="bar"><i style="width:${(v * 100).toFixed(0)}%"></i></span><span class="num">${pct(v)}</span></span>`;
}

function renderRuns() {
  const f = q("#filter").value.toLowerCase(), out = q("#result-filter").value;
  const shown = runs.filter((r) => (!f || JSON.stringify(r).toLowerCase().includes(f)) && (!out || (out === "pass") === r.passed));
  const latest = runs[0];
  const s = latest?.summary || {};
  const tone = (v, good = 0.9, ok = 0.6) => (v >= good ? "good" : v >= ok ? "warn" : "bad");
  q("#cards").innerHTML = [
    ["Pass rate", pct(s.pass_rate), `${(s.total || 0) - (s.failed || 0)} of ${s.total || 0} cases`, tone(s.pass_rate)],
    ["Grounded", pct(s.semantic_groundedness || s.groundedness), "claims supported by evidence", tone(s.semantic_groundedness || s.groundedness, 0.8, 0.5)],
    ["Tool correctness", pct(s.tool_correctness), "expected tools, typed args", tone(s.tool_correctness)],
    ["Pending review", reviews.length, "across all runs", reviews.length ? "warn" : "good"],
  ].map(([label, value, hint, cls]) => `<div class="card ${cls}"><span class="label">${label}</span><strong>${value}</strong><span class="hint">${hint}</span></div>`).join("");
  q("#scope").innerHTML = latest ? `Headline numbers are for the latest run: <b>${esc(latest.label)}</b> · ${esc(latest.suite)}` : "No runs yet. Run <code>agent-harness run … --db</code> to populate the console.";
  q("#runs-body").innerHTML = shown.map((r) => `
    <tr data-id="${esc(r.id)}" class="${r.id === selectedRun ? "selected" : ""}">
      <td><div class="run-label">${esc(r.label)}</div><div class="when">${esc(r.created_at.slice(0, 19).replace("T", " "))}</div></td>
      <td><span class="pill ${r.passed ? "pass" : "fail"}">${r.passed ? "✓ PASS" : "✕ FAIL"}</span></td>
      <td>${esc(r.model)}</td>
      <td>${esc(r.suite)}</td>
      <td>${meter(r.summary.pass_rate)}</td>
      <td class="num">${pct(r.summary.semantic_groundedness || r.summary.groundedness)}</td>
      <td class="num">${pct(r.summary.tool_correctness)}</td>
      <td class="num">${pct(r.summary.safety_pass_rate)}</td>
      <td class="num">$${Number(r.summary.total_cost_usd || 0).toFixed(4)}</td>
    </tr>`).join("") || `<tr><td colspan="9" class="empty">No runs match this filter.</td></tr>`;
  document.querySelectorAll("#runs-body tr[data-id]").forEach((el) => (el.onclick = () => showRun(el.dataset.id)));
}

function timeline(trace) {
  if (!trace || !trace.length) return '<p class="muted">No trace steps recorded.</p>';
  return `<ol class="timeline">${trace.map((t) => `
    <li class="${esc(t.status)}"><span class="t-type">${esc(t.type)}</span><span class="t-name">${esc(t.name)}</span><span class="t-status">${esc(human(t.status))}${t.blocked_reason ? " · " + esc(t.blocked_reason) : ""}</span></li>`).join("")}</ol>`;
}

async function showRun(id) {
  selectedRun = id;
  renderRuns();
  const r = await api("/api/runs/" + id);
  const p = q("#trace-panel");
  const failed = r.results.filter((x) => !x.passed).length;
  p.classList.remove("hidden");
  p.innerHTML = `
    <div class="section-title"><h2>${esc(r.suite_name)}</h2><span class="muted">${r.results.length} cases · ${failed} failed · ${r.results.filter((x) => x.needs_review).length} routed to review</span></div>
    <div class="case-grid">${r.results.map((x) => `
      <article class="case ${x.passed ? "" : "fail"}">
        <div class="case-head"><span class="case-id">${esc(x.case_id)}</span>
          <span>${x.needs_review ? '<span class="pill attn">review</span> ' : ""}<span class="pill ${x.passed ? "pass" : "fail"}">${x.passed ? "PASS" : "FAIL"}</span></span></div>
        <div class="case-stats"><span>quality <b>${pct(x.quality_score)}</b></span><span>risk <b>${pct(x.risk_score)}</b></span><span>confidence <b>${pct(x.confidence)}</b></span><span>${(x.trace || []).length} steps</span></div>
        <details class="more"><summary>Prompt, output and trace</summary>
          <div class="io"><div><h4>Prompt</h4><pre>${esc(x.prompt)}</pre></div><div><h4>Output</h4><pre>${esc(x.output)}</pre></div></div>
          ${(x.mitigations || []).length ? `<p><b>Mitigations:</b> ${x.mitigations.map(esc).join(", ")}</p>` : ""}
          ${timeline(x.trace)}
        </details>
      </article>`).join("")}</div>`;
  p.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderReviews() {
  const badge = q("#review-count");
  badge.textContent = reviews.length;
  badge.classList.toggle("hidden", !reviews.length);
  q("#review-list").innerHTML = `<h3>Pending (${reviews.length})</h3>` + (reviews.length
    ? reviews.map((r) => `
      <button data-id="${esc(r.id)}" class="${selected && selected.id === r.id ? "selected" : ""}">
        <span class="case-id">${esc(r.case_id)}</span>
        <span class="meta"><span class="pill attn">${esc(human(r.payload.capsule?.root_cause || "ambiguous"))}</span><span class="muted">confidence ${pct(r.payload.confidence)}</span></span>
      </button>`).join("")
    : '<div class="empty"><span class="big">🎉</span>Queue is clear.</div>');
  document.querySelectorAll("#review-list button[data-id]").forEach((el) => (el.onclick = () => selectReview(el.dataset.id)));
}

function selectReview(id) {
  selected = reviews.find((r) => r.id === id);
  renderReviews();
  const p = selected.payload, c = p.capsule || {};
  decision = "pass";
  q("#review-detail").innerHTML = `
    <div class="section-title" style="margin-top:0"><h2 class="case-id" style="font-size:16px">${esc(selected.case_id)}</h2><span class="pill attn">needs a human</span></div>
    <div class="capsule">
      <div><span>Root cause</span><b>${esc(human(c.root_cause || "ambiguous"))}</b></div>
      <div><span>Failed checks</span><b>${esc((c.failed_checks || []).join(", ") || "none")}</b></div>
      <div><span>Fingerprint</span><b style="font-family:var(--mono)">${esc(c.fingerprint || "—")}</b></div>
    </div>
    ${c.suggested_control ? `<div class="control"><b>Suggested control:</b> ${esc(c.suggested_control)}</div>` : ""}
    <div class="io"><div><h4>Prompt</h4><pre>${esc(p.prompt)}</pre></div><div><h4>Agent output</h4><pre>${esc(show(p.output))}</pre></div></div>
    <div class="block"><h4>Trace</h4>${timeline(p.trace)}</div>
    <div class="decision">
      <div class="row"><span class="muted">Decision</span>
        <div class="seg" id="seg"><button data-v="pass" class="on">✓ Pass</button><button data-v="fail">✕ Fail</button><button data-v="ambiguous">? Ambiguous</button></div></div>
      <div class="row"><span class="muted">Reviewer</span><input id="reviewer" placeholder="Your name"></div>
      <textarea id="notes" rows="3" placeholder="Why? These notes travel with the evidence capsule."></textarea>
      <button class="primary" id="save">Save decision</button>
    </div>`;
  document.querySelectorAll("#seg button").forEach((b) => (b.onclick = () => {
    decision = b.dataset.v;
    document.querySelectorAll("#seg button").forEach((x) => x.classList.toggle("on", x === b));
  }));
  q("#save").onclick = saveReview;
}

async function saveReview() {
  const button = q("#save");
  button.disabled = true;
  try {
    await api("/api/reviews/" + selected.id, {
      method: "POST",
      body: JSON.stringify({ decision, notes: q("#notes").value, reviewer: q("#reviewer").value || "human", version: selected.version }),
    });
    selected = null;
    await load();
    q("#review-detail").innerHTML = '<div class="empty"><span class="big">✅</span>Decision saved. Pick the next case.</div>';
    toast("Decision saved");
  } catch (e) {
    button.disabled = false;
    toast("Could not save: " + e.message);
  }
}

q("#filter").oninput = renderRuns;
q("#result-filter").onchange = renderRuns;
document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
  ["runs", "reviews"].forEach((id) => q("#" + id).classList.toggle("hidden", id !== b.dataset.tab));
}));
load();
</script>
</body>
</html>
