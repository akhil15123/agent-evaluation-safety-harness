<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Harness Console</title><style>
:root{--ink:#101b35;--blue:#3265ed;--paper:#f3f6fb;--line:#dce3ef;--muted:#68768b;--red:#c23d52;--green:#087f5b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,sans-serif}header{background:#0d1b36;color:white;padding:24px 30px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:22px}header span{color:#9eb8df}main{max-width:1300px;margin:auto;padding:28px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button,.button{border:1px solid var(--line);background:white;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700}.tabs button.active{background:var(--blue);color:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:18px}.card strong{font-size:26px;display:block}.card span,.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);text-transform:uppercase}.pass{color:var(--green);font-weight:750}.fail{color:var(--red);font-weight:750}.hidden{display:none}.review{display:grid;grid-template-columns:280px 1fr;gap:16px}.review-list button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:white;padding:13px;cursor:pointer}.trace{border-left:3px solid #b8c8e5;padding:8px 12px;margin:8px 0;background:#f8faff}pre{white-space:pre-wrap;overflow:auto;background:#101b35;color:#dce8ff;padding:14px;border-radius:8px}textarea,input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;margin:4px 0 10px}.row{display:flex;gap:8px}.row>*{flex:1}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.review{grid-template-columns:1fr}}
</style></head><body><header><div><h1>Agent Harness Console</h1><span>Persistent runs · traces · human decisions</span></div><div id="connection">connecting…</div></header><main><div class="tabs"><button class="active" data-tab="runs">Runs</button><button data-tab="reviews">Review queue</button></div><section id="runs"><div class="cards" id="cards"></div><div class="panel"><div class="row"><input id="filter" placeholder="Filter model, suite, or label"><select id="result-filter"><option value="">All outcomes</option><option value="pass">Passed</option><option value="fail">Failed</option></select></div><table><thead><tr><th>Run</th><th>Model</th><th>Suite</th><th>Pass</th><th>Grounded</th><th>Tools</th><th>Safety</th><th>Cost</th></tr></thead><tbody id="runs-body"></tbody></table></div><div class="panel hidden" id="trace-panel"></div></section><section id="reviews" class="hidden"><div class="review"><div class="panel review-list" id="review-list"></div><div class="panel" id="review-detail"><p class="muted">Choose a case to inspect its evidence capsule and trace.</p></div></div></section></main><script>
let runs=[],reviews=[],selected=null;const q=s=>document.querySelector(s);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){let token=localStorage.getItem('agentHarnessToken');opt.headers={'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})};let r=await fetch(path,opt);if(r.status===401){token=prompt('Dashboard token');localStorage.setItem('agentHarnessToken',token);return api(path,opt)}if(!r.ok)throw Error((await r.json()).error);return r.json()}async function load(){try{[runs,reviews]=await Promise.all([api('/api/runs'),api('/api/reviews?status=pending')]);q('#connection').textContent='● live';renderRuns();renderReviews()}catch(e){q('#connection').textContent='error: '+e.message}}function renderRuns(){let f=q('#filter').value.toLowerCase(),out=q('#result-filter').value;let shown=runs.filter(r=>(!f||JSON.stringify(r).toLowerCase().includes(f))&&(!out||(out==='pass')===r.passed));let latest=runs[0]?.summary||{};q('#cards').innerHTML=[['Pass rate',pct(latest.pass_rate)],['Grounded',pct(latest.semantic_groundedness||latest.groundedness)],['Tool correctness',pct(latest.tool_correctness)],['Pending review',reviews.length]].map(x=>`<div class=card><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');q('#runs-body').innerHTML=shown.map(r=>`<tr data-id=${r.id}><td><b>${esc(r.label)}</b><br><span class=muted>${esc(r.created_at.slice(0,19))}</span></td><td>${esc(r.model)}</td><td>${esc(r.suite)}</td><td class=${r.passed?'pass':'fail'}>${pct(r.summary.pass_rate)}</td><td>${pct(r.summary.semantic_groundedness||r.summary.groundedness)}</td><td>${pct(r.summary.tool_correctness)}</td><td>${pct(r.summary.safety_pass_rate)}</td><td>$${Number(r.summary.total_cost_usd||0).toFixed(4)}</td></tr>`).join('');document.querySelectorAll('#runs-body tr').forEach(el=>el.onclick=()=>showRun(el.dataset.id))}async function showRun(id){let r=await api('/api/runs/'+id);let p=q('#trace-panel');p.classList.remove('hidden');p.innerHTML=`<h2>${esc(r.suite_name)}</h2>`+r.results.map(x=>`<details><summary class=${x.passed?'pass':'fail'}>${x.passed?'PASS':'FAIL'} · ${esc(x.case_id)} · confidence ${pct(x.confidence)}</summary><h4>Prompt</h4><pre>${esc(x.prompt)}</pre><h4>Output</h4><pre>${esc(x.output)}</pre>${(x.trace||[]).map(t=>`<div class=trace><b>${esc(t.type)} · ${esc(t.name)}</b><br><span class=muted>${esc(t.status)}</span></div>`).join('')}</details>`).join('');p.scrollIntoView({behavior:'smooth'})}function renderReviews(){q('#review-list').innerHTML=`<h3>Pending (${reviews.length})</h3>`+reviews.map(r=>`<button data-id=${r.id}><b>${esc(r.case_id)}</b><br><span class=muted>${esc(r.payload.capsule?.root_cause||'ambiguous')}</span></button>`).join('');document.querySelectorAll('#review-list button').forEach(el=>el.onclick=()=>selectReview(el.dataset.id))}function selectReview(id){selected=reviews.find(r=>r.id===id);let p=selected.payload;q('#review-detail').innerHTML=`<h2>${esc(selected.case_id)}</h2><p><b>Root cause:</b> ${esc(p.capsule?.root_cause)}</p><pre>${esc(p.prompt)}</pre><pre>${esc(p.output)}</pre><h3>Trace</h3>${(p.trace||[]).map(t=>`<div class=trace><b>${esc(t.type)} · ${esc(t.name)}</b><br>${esc(t.status)}</div>`).join('')}<div class=row><select id=decision><option>pass</option><option>fail</option><option>ambiguous</option></select><input id=reviewer placeholder=Reviewer></div><textarea id=notes placeholder="Review notes"></textarea><button class=button id=save>Save decision</button>`;q('#save').onclick=saveReview}async function saveReview(){await api('/api/reviews/'+selected.id,{method:'POST',body:JSON.stringify({decision:q('#decision').value,notes:q('#notes').value,reviewer:q('#reviewer').value||'human',version:selected.version})});await load();q('#review-detail').innerHTML='<p class=pass>Decision saved.</p>'}function pct(v){return `${Math.round(Number(v||0)*100)}%`}q('#filter').oninput=renderRuns;q('#result-filter').onchange=renderRuns;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));['runs','reviews'].forEach(id=>q('#'+id).classList.toggle('hidden',id!==b.dataset.tab))});load();
</script></body></html>
