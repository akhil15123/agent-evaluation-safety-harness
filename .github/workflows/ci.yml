name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - name: Run production gate
        run: agent-harness run examples/support-suite.json --demo-agent --json report.json --html report.html
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report-py${{ matrix.python-version }}
          path: |
            report.json
            report.html
