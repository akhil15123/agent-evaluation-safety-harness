<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Agent Harness v1 architecture</title><desc id="desc">Evaluation suites flow through a statistical runner, policy gate, provider adapters, isolated tool sandbox, flight recorder, evaluators, evidence store, dashboard, review, and telemetry.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08152f"/><stop offset="1" stop-color="#244f8d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".2"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L8 3 0 6z" fill="#7eabff"/></marker></defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/><g font-family="system-ui"><text x="48" y="54" fill="white" font-size="27" font-weight="750">Agent Harness v1 · failure-to-proof architecture</text><text x="48" y="80" fill="#b9c9df" font-size="14">Local-first · provider-neutral · side-effect aware · evidence backed</text></g>
  <g font-family="system-ui" filter="url(#s)">
    <g transform="translate(48 120)"><rect width="260" height="110" rx="14" fill="white"/><text x="18" y="29" fill="#3265ed" font-size="11" font-weight="800">DECLARE</text><text x="18" y="59" fill="#12213c" font-size="19" font-weight="700">Versioned suites + policy</text><text x="18" y="85" fill="#66758a" font-size="13">Cases · contracts · canaries · schemas</text></g>
    <g transform="translate(364 120)"><rect width="260" height="110" rx="14" fill="white"/><text x="18" y="29" fill="#8c4dce" font-size="11" font-weight="800">RUN</text><text x="18" y="59" fill="#12213c" font-size="19" font-weight="700">Statistical runner</text><text x="18" y="85" fill="#66758a" font-size="13">Trials · concurrency · seeds · budgets</text></g>
    <g transform="translate(680 120)"><rect width="472" height="110" rx="14" fill="white"/><text x="18" y="29" fill="#078061" font-size="11" font-weight="800">INVOKE</text><text x="18" y="59" fill="#12213c" font-size="19" font-weight="700">Provider adapters</text><text x="18" y="85" fill="#66758a" font-size="13">OpenAI Responses · Anthropic Messages · Ollama · HTTP · recorded</text></g>
    <g transform="translate(48 284)"><rect width="260" height="110" rx="14" fill="#17385e" stroke="#557da8"/><text x="18" y="29" fill="#9fc1ff" font-size="11" font-weight="800">MITIGATE</text><text x="18" y="59" fill="white" font-size="19" font-weight="700">Pre-execution gate</text><text x="18" y="85" fill="#bdcce1" font-size="13">Injection · confidence · authorization</text></g>
    <g transform="translate(364 284)"><rect width="260" height="110" rx="14" fill="#17385e" stroke="#557da8"/><text x="18" y="29" fill="#9fc1ff" font-size="11" font-weight="800">CONTAIN</text><text x="18" y="59" fill="white" font-size="19" font-weight="700">Typed ToolSandbox</text><text x="18" y="85" fill="#bdcce1" font-size="13">Args · confirmation · state · egress</text></g>
    <g transform="translate(680 284)"><rect width="472" height="110" rx="14" fill="#17385e" stroke="#557da8"/><text x="18" y="29" fill="#9fc1ff" font-size="11" font-weight="800">OBSERVE</text><text x="18" y="59" fill="white" font-size="19" font-weight="700">Agent flight recorder</text><text x="18" y="85" fill="#bdcce1" font-size="13">Prompts · provenance · tool args/results · model · cost · failures</text></g>
    <g transform="translate(48 448)"><rect width="300" height="118" rx="14" fill="white"/><text x="18" y="29" fill="#c13d52" font-size="11" font-weight="800">EVALUATE</text><text x="18" y="59" fill="#12213c" font-size="19" font-weight="700">Quality + safety metrics</text><text x="18" y="85" fill="#66758a" font-size="13">Grounding · tools · trajectory · risk</text><text x="18" y="104" fill="#66758a" font-size="13">Wilson CI · p95 · flake detection</text></g>
    <g transform="translate(402 448)"><rect width="330" height="118" rx="14" fill="white"/><text x="18" y="29" fill="#c26a17" font-size="11" font-weight="800">PRESERVE</text><text x="18" y="59" fill="#12213c" font-size="19" font-weight="700">Evidence + persistence</text><text x="18" y="85" fill="#66758a" font-size="13">Capsules · JSON/HTML · SQLite · replay</text><text x="18" y="104" fill="#66758a" font-size="13">First-divergence trace comparison</text></g>
    <g transform="translate(786 448)"><rect width="366" height="118" rx="14" fill="white"/><text x="18" y="29" fill="#078061" font-size="11" font-weight="800">ACT</text><text x="18" y="59" fill="#12213c" font-size="19" font-weight="700">Console + integrations</text><text x="18" y="85" fill="#66758a" font-size="13">Trace explorer · human review · audit</text><text x="18" y="104" fill="#66758a" font-size="13">CI artifacts · JSONL · OpenTelemetry</text></g>
  </g>
  <g stroke="#7eabff" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M308 175h48"/><path d="M624 175h48"/><path d="M915 230v45h-720v1"/><path d="M308 339h48"/><path d="M624 339h48"/><path d="M916 394v30h-718v16"/><path d="M348 507h46"/><path d="M732 507h46"/></g>
  <text x="48" y="620" fill="#9eb8df" font-family="system-ui" font-size="13">Dangerous actions are blocked before execution; saved traces can be re-evaluated without re-running tools.</text>
</svg>
