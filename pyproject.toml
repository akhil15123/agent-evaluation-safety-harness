[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluation-safety-harness"
version = "1.0.0"
description = "An agent flight recorder for evaluation, trace forensics, and counterfactual safety replay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akhil" }]
keywords = ["ai", "agents", "evaluation", "safety", "llm", "red-team", "tracing", "forensics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[project.optional-dependencies]
observability = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.mypy]
python_version = "3.11"
packages = ["agent_harness"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["agent_harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65
