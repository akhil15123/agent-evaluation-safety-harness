[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-evaluation-safety-harness"
version = "0.2.0"
description = "An agent flight recorder for evaluation, trace forensics, and counterfactual safety replay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akhil" }]
keywords = ["ai", "agents", "evaluation", "safety", "llm", "red-team", "tracing", "forensics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
